server {
    listen 80;
    server_name w13-admin.pupasoft.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name w13-admin.pupasoft.com;

    # SSL certificates (make sure to replace these with your actual paths)
    ssl_certificate /etc/letsencrypt/live/w13-admin.pupasoft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/w13-admin.pupasoft.com/privkey.pem;

    # Enable SSL settings (you can adjust the SSL settings according to your security needs)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'HIGH:!aNULL:!MD5';
    ssl_prefer_server_ciphers on;

    # Document root (ensure it points to your backend's root)
    root /var/www/back;

    # Cache-control for index.html
    location ~ /index.html {
        expires -1;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
    }

    # Serving your frontend (if applicable) and fallback to index.html
    location / {
        try_files $uri$args $uri$args/ /index.html;
    }

    # Proxy requests to backend (assuming Strapi is running on localhost:1337)
    location ~ ^/(api|admin|i18n|content-manager|users-permissions)/ {
        proxy_pass http://localhost:1337;  # No need for HTTPS here as Strapi backend should be on HTTP internally
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_pass_request_headers on;
    }
}